<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#09132b"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1124"/>
    </linearGradient>

    <!-- Crimson & Gold Glow -->
    <radialGradient id="crimsonAura" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#4c0519" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldAura" cx="15%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Mountain Silhouette Gradient -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>
  <rect width="1920" height="600" fill="url(#crimsonAura)"/>
  <rect width="1920" height="600" fill="url(#goldAura)"/>
  <rect width="1920" height="600" fill="url(#centerGlow)"/>

  <!-- Tactical Surveillance Grid -->
  <rect width="1920" height="600" fill="url(#tacticalGrid)"/>

  <!-- Dramatic Light Beams -->
  <polygon points="200,0 350,0 250,600 50,600" fill="#38bdf8" fill-opacity="0.04"/>
  <polygon points="850,0 1020,0 1150,600 720,600" fill="#60a5fa" fill-opacity="0.03"/>
  <polygon points="1500,0 1680,0 1850,600 1420,600" fill="#f59e0b" fill-opacity="0.035"/>

  <!-- Mountain Silhouette Range (Southern Thailand / Sankalakhiri Range) -->
  <path d="M0,450 Q180,380 360,420 T720,370 T1080,410 T1440,360 T1800,400 L1920,430 L1920,600 L0,600 Z" fill="url(#mountainGrad1)"/>
  <path d="M0,500 Q220,440 480,470 T960,450 T1440,480 T1920,460 L1920,600 L0,600 Z" fill="url(#mountainGrad2)"/>

  <!-- Tactical Radar Rings in Center-Right -->
  <g transform="translate(1450, 280)" opacity="0.3">
    <circle r="220" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,8"/>
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,6"/>
    <circle r="100" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#93c5fd" stroke-width="1.2"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6,4"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6,4"/>
    <!-- Compass markings -->
    <text x="250" y="4" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="start">090° E</text>
    <text x="0" y="-250" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">000° N</text>
    <text x="-250" y="4" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="end">270° W</text>
    <text x="0" y="260" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle">180° S</text>
  </g>

  <!-- Tactical Coordinates Overlay -->
  <g fill="#94a3b8" font-family="monospace" font-size="11" opacity="0.45">
    <text x="40" y="80">P9_SEC_COMMAND: ZONE_3_PROVINCES + 4_DISTRICTS_SONGKHLA</text>
    <text x="40" y="100">COORDINATES: LAT 6.540° N, LON 101.280° E | SECTOR STATUS: ACTIVE</text>
    <text x="40" y="120">POLICE REGION 9 MANPOWER OPERATIONAL DASHBOARD</text>
  </g>

  <!-- Left Guard Emblem Rings -->
  <g transform="translate(320, 280)" opacity="0.35">
    <circle r="180" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,7"/>
    <circle r="120" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <circle r="60" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="2,4"/>
  </g>

  <!-- Vignette overlay top and bottom -->
  <rect width="1920" height="70" fill="url(#mountainGrad2)" opacity="0.7"/>
  <rect y="530" width="1920" height="70" fill="#020617" opacity="0.85"/>
</svg>
